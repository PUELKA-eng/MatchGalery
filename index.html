        <section class="zona-operacion">
            <p id="mensaje">Elige una imagen y toca un cuadro.</p>

            <input
                type="number"
                id="respuesta"
                placeholder="Tu respuesta"
                inputmode="numeric"
            >

            <button id="comprobar">Comprobar</button>
            <button id="nuevoJuego" class="secundario">
                Nuevo juego
            </button>
            <label>
    <input type="checkbox" id="modoAleatorio">
    Cuadro aleatorio
</label>
        </section>

        <p id="progreso">Cuadros descubiertos: 0/25</p>
    </main>

    <script src="script.js"></script>

    <script>
if ("serviceWorker" in navigator) {

    });

</script>
</body>
</html>
